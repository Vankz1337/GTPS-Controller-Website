<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>GTPS Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <span class="eyebrow">GTPS CONTROL PANEL</span>
    <h1>Server Controller</h1>
    <p class="muted">A lightweight web interface for managing your Growtopia private server.</p>
    <section class="status">
      <span class="dot"></span>
      <div><strong>Control panel ready</strong><small id="status-text">Interface loaded successfully.</small></div>
    </section>
    <button id="check-button" type="button">Check interface</button>
    <footer>GTPS Controller · Web interface</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
